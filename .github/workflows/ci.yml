# CI test gate / CI 测试门禁
#
# Rationale / 背景: this repository had no CI at all — the docs-mirror guard
# existed as a script but nothing ran it, so the ZH/EN pair could drift silently
# and nobody would find out until a reader did. This workflow is the gate: every
# push to master and every pull request must pass all four gates before it can
# land.
#
# Four jobs, independent and parallel: a failure reads as "docs" / "brand" /
# "frontend" / "rust" in the checks list instead of hiding inside one red job.
#
# What this gate does NOT do: it does not build the Tauri application bundle.
# Packaging (dmg/icns) needs platform SDKs and belongs in a release workflow
# triggered by a tag, the same split the Cinder main repo uses.
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

# Repeated pushes on one branch keep only the newest run; the older in-flight
# ones are cancelled, so the queue does not pile up and the required check stays
# fresh.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The gate only needs to read the repo. Least privilege, and it keeps the token
# from being usable as a write credential inside untrusted PR code.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------- docs ----
  # The bilingual manual is a strict 1:1 mirror (docs/** ↔ docs/en/**). That
  # invariant is easy to break — edit one side, forget the other — and it is
  # invisible in review because both files still look fine on their own. The
  # guard is the script; this job is what makes it actually run.
  docs:
    name: Docs mirror
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - name: Check the ZH/EN mirror
        run: npm run check:docs

  # -------------------------------------------------------------- brand ----
  # ADR-0049 renamed this product: the assistant is now Warden, the workbench
  # it talks to is Cinder Desktop. The rename drew one line — the display
  # layer moves, the interface layer is frozen — and both halves drift on
  # their own: a display-layer miss shows the user a name that no longer
  # exists, and an interface-layer "cleanup" breaks every MCP client config
  # that was wired to `repotory-mcp` and the `repotory_*` tool names.
  #
  # So this gate checks both ends: the product name at every surface equals
  # the one in brand.json, the frozen identifiers are still there verbatim,
  # the old brand word is gone from the current surfaces, and the anchors
  # pointing at renamed headings still point at a heading.
  brand:
    name: Brand drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - name: Check brand drift
        run: npm run check:brand

  # ----------------------------------------------------------- frontend ----
  # `npm run build` runs `tsc && vite build`, so it type-checks first and then
  # bundles. Both halves matter: the type checker catches the mistakes a bundle
  # would happily ship, and the bundle catches the imports a type checker
  # accepts but the browser cannot resolve.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  # --------------------------------------------------------------- rust ----
  # Three checks, in the order that fails fastest:
  #   cargo fmt --check  — formatting is not a matter of taste here; CI must not
  #                         be the thing that decides it, and a reformat-only
  #                         commit is noise in the history.
  #   cargo clippy       — lint. Kept separate from the test job so a lint
  #                         finding reads as "clippy" instead of hiding inside a
  #                         red test run.
  #   cargo test         — the suite. It includes the end-to-end tests that
  #                         drive the fake MCP server over a real pipe, and
  #                         the guard that keeps the memory layer from
  #                         re-introducing a hardcoded tool list — whose
  #                         negative assertions were verified to turn red
  #                         when that list comes back.
  #
  # `test-fixtures` is a Cargo feature, not a flag: the fake MCP server is a
  # binary, so without the feature Cargo never compiles it and the
  # end-to-end tests cannot find it. The feature keeps it out of ordinary
  # builds and out of the release bundle — a test fixture has no business in
  # a shipped app.
  rust:
    name: Rust fmt, clippy and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The Tauri crate tree reaches `webkit2gtk-sys` and `gtk-sys`, whose
      # build scripts call pkg-config. Without the -dev packages the build
      # fails at "webkit2gtk-4.1 not found" — a link error, not a Rust one,
      # so it reads like a toolchain problem and sends you the wrong way.
      #
      # The GitHub-hosted Ubuntu image does not carry these; Tauri documents
      # this exact list for Debian/Ubuntu. `libayatana-appindicator3-dev` is
      # the tray icon's library — the name differs from the old
      # `libappindicator3-dev`, which does not exist on 24.04.
      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            curl \
            wget

      # The version comes from rust-toolchain.toml, so CI and every local
      # checkout resolve the same toolchain — one truth, one place.
      #
      # This is `actions-rust-lang/setup-rust-toolchain`, NOT
      # `dtolnay/rust-toolchain`: the latter's `toolchain` input is
      # `required: true` and it exits 1 when the input is empty, so it cannot
      # be used to defer the version to a file. This action reads
      # rust-toolchain.toml when no `toolchain` input is given, which is
      # exactly the single-source-of-truth property this repository wants.
      #
      # `components` is set explicitly because the toolchain file's
      # `components` key is not the mechanism this action uses to decide
      # which components to install; without it the fmt and clippy steps
      # below fail with "component not found".
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          components: rustfmt, clippy

      # The crates.io index is fetched over the sparse protocol; the default
      # git protocol makes this step minutes slower on a cold cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: src-tauri
        # `-D warnings` turns a lint into a build failure. Without it clippy
        # prints advice that everyone learns to scroll past.
        #
        # The feature is on so the fake MCP server — a binary Cargo skips
        # without it — is linted too. A fixture that is never linted is a
        # fixture whose warnings nobody sees.
        run: cargo clippy --all-targets --features test-fixtures -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test --all-targets --features test-fixtures
