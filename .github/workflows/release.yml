# Release — build and publish the Tauri bundle
#
# Tag-triggered only. `ci.yml` already gates every push, so this file does not
# repeat the tests: it waits for that run to be green and then builds. The
# Cinder main repo learned this the hard way (v2.14.0 shipped from a red
# commit), so the gate is a real job here too.
#
# Signing and notarisation are ON: the Developer ID certificate is configured,
# so the macOS bundle is signed, notarised by Apple and stapled. The steps
# below copy the six APPLE_* variables out of the repository secrets and
# refuse to build when the certificate is there but the notarisation
# credentials are not — a release that skips notarisation still installs, so
# a silent failure ships an app that pops "Apple cannot verify" for everyone.
#
# A macOS build produces two artefacts: the .app and the .dmg around it.
# Tauri's bundler signs and notarises the .app but never notarises the .dmg,
# and the .dmg is what a browser downloads and what Gatekeeper assesses
# first — so the .dmg is notarised and stapled here as well.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Least privilege: only `publish` may write, and only to releases.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The release must not ship a commit whose CI was red.
  ci-gate:
    name: Require a green CI run on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Poll the CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 80); do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
                     --workflow CI --json status,conclusion --limit 10)
            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
              echo "CI is green on $GITHUB_SHA."
              exit 0
            fi
            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' >/dev/null; then
              echo "::error::CI on $GITHUB_SHA did not succeed — refusing to publish."
              exit 1
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA."
          exit 1

  publish:
    name: Publish (${{ matrix.platform }})
    needs: ci-gate
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            rust-targets: ''
            args: ''
          - platform: windows-latest
            rust-targets: ''
            args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # The version comes from rust-toolchain.toml — one truth, one place.
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          target: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      # Same list as ci.yml: without the -dev packages the build fails inside
      # webkit2gtk-sys/gtk-sys build scripts, which reads like a Rust error.
      - name: Install the Tauri system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file \
            curl \
            wget

      - name: Install JS dependencies
        run: npm ci

      # Apple signing + notarisation, switched on by the presence of a
      # certificate and off by its absence. This is a step rather than `env:`
      # on the build step because GitHub resolves a missing secret to the empty
      # string — and an EMPTY APPLE_CERTIFICATE is not "no certificate", it is
      # a certificate that fails to import. Writing the variables into
      # $GITHUB_ENV only when they have content keeps the unsigned build
      # byte-for-byte what it was.
      #
      # The App Store Connect API key is preferred over an Apple ID password:
      # no password ends up in the workflow log, and there is no two-factor
      # prompt to answer in the middle of a release. The .p8 key file has to
      # exist on disk for notarytool to read it, so it is written out here.
      - name: Configure Apple signing when a certificate is available
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${CERT}" ]; then
            echo "No Apple certificate configured — the bundle stays ad-hoc signed."
            echo "See docs/troubleshooting.md for what users then have to do."
            exit 0
          fi
          {
            echo "APPLE_CERTIFICATE=${CERT}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CERT_PASSWORD}"
            echo "APPLE_SIGNING_IDENTITY=${SIGNING_IDENTITY}"
            echo "APPLE_TEAM_ID=${TEAM_ID}"
          } >> "$GITHUB_ENV"
          if [ -n "${APPLE_ID_SECRET}" ]; then
            echo "APPLE_ID=${APPLE_ID_SECRET}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${APPLE_PASSWORD_SECRET}" >> "$GITHUB_ENV"
          fi
          if [ -n "${API_KEY}" ] && [ -n "${API_ISSUER}" ] && [ -n "${API_KEY_P8}" ]; then
            printf '%s' "${API_KEY_P8}" | base64 --decode > "$RUNNER_TEMP/AuthKey_${API_KEY}.p8"
            chmod 600 "$RUNNER_TEMP/AuthKey_${API_KEY}.p8"
            echo "APPLE_API_KEY=${API_KEY}" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=${API_ISSUER}" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey_${API_KEY}.p8" >> "$GITHUB_ENV"
          fi
          echo "Apple signing and notarisation are ON for this run."

      # The credentials are checked BEFORE the build rather than after it.
      #
      # Tauri fails with "the environment variable APPLE_ID is missing" or a
      # notarytool error, both of which arrive twenty minutes into a macOS
      # build and read like a broken toolchain. Checking first turns a
      # twenty-minute mystery into a one-line answer, and it is the only way
      # to tell "signed and notarised" apart from "signed but the notarisation
      # silently did not happen".
      - name: Verify the notarisation credentials are complete
        if: matrix.platform == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CERT}" ]; then
            echo "No certificate configured — the bundle will be ad-hoc signed. Nothing to check."
            exit 0
          fi
          if [ -n "${API_KEY}" ] || [ -n "${API_ISSUER}" ] || [ -n "${API_KEY_P8}" ]; then
            missing=""
            [ -n "${API_KEY}" ] || missing="${missing} APPLE_API_KEY"
            [ -n "${API_ISSUER}" ] || missing="${missing} APPLE_API_ISSUER"
            [ -n "${API_KEY_P8}" ] || missing="${missing} APPLE_API_KEY_P8"
            if [ -n "${missing}" ]; then
              echo "::error::the App Store Connect key is half configured — missing:${missing}"
              exit 1
            fi
            echo "Notarisation credentials: App Store Connect API key."
          elif [ -n "${APPLE_ID_SECRET}" ] || [ -n "${APPLE_PASSWORD_SECRET}" ] || [ -n "${TEAM_ID}" ]; then
            missing=""
            [ -n "${APPLE_ID_SECRET}" ] || missing="${missing} APPLE_ID"
            [ -n "${APPLE_PASSWORD_SECRET}" ] || missing="${missing} APPLE_PASSWORD"
            [ -n "${TEAM_ID}" ] || missing="${missing} APPLE_TEAM_ID"
            if [ -n "${missing}" ]; then
              echo "::error::the Apple ID credentials are half configured — missing:${missing}"
              exit 1
            fi
            echo "Notarisation credentials: Apple ID."
          else
            echo "::error::a certificate is configured but there are no notarisation credentials."
            echo "::error::Set either APPLE_API_KEY + APPLE_API_ISSUER + APPLE_API_KEY_P8,"
            echo "::error::or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID."
            echo "::error::See docs/signing.md."
            exit 1
          fi

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Warden ${{ github.ref_name }}
          releaseBody: |
            Warden：跑在本机的 copilot，记忆层由 Cinder 通过 MCP 提供。

            **M4：记忆层有了只读的三块面板。** 上下文（分支与未提交 diff，不经 Cinder）、已批准知识（`repotory_wiki_search` 的 browse feed）、跨会话记忆（`repotory_context` 简报原文）。三块各报各的错——一块可选依赖死掉，不会白掉整屏。

            **M5：本机模型，不用折腾也能跑。** 设置页新增「本机模型」卡，把状态分成四态：未安装 / 装了没运行 / 有运行时但缺默认模型 / 就绪，**每个状态给一条可执行的话**（`ollama serve` 还是 `ollama pull qwen3:8b`）——把「装了没跑」报成「未安装」，会让用户去下载他电脑上已有的东西。探测有 2 秒预算，本机端点要么立刻答要么没在跑；延迟直接显示，因为本机模型上这是用户真正感觉得到的数字。**没有为 Ollama 开分支**：判断一律是「这个 base URL 答不答」，本地与云端同一件事。唯一走原生 API 的是拉模型（OpenAI 兼容面里没有下载这件事），URL 从配置的 base URL 推出来，不是第二个硬编码主机。

            **Phase 6：`repotory-agent init` 一键初始化。** 不开窗口，在终端逐项检查配置 / 记忆层 / 本机模型，`✓` 正常、`!` 注意（不阻塞）、`✗` 需处理，退出码只在有 `✗` 时非零。复用 GUI 的同一条真实路径，不另开一套初始化逻辑；报告里带记忆层**契约版本**。

            **长期知识写回，现在过一道人确认。** 模型可以发起 `notes_create / notes_update / notes_organize`，但**调用前硬拦截**：对话内确认卡，写入参数**可编辑**——你可以改完再点运行，批准的是修订版（部分同意）；写入 `knowledge-audit.jsonl` **独立追加式审计**（谁、何时、哪个工具、什么参数、是否修订），不进检索层；超时 / 关窗**默认拒绝**，Fail-Closed，不静默放行。

            **错误收敛到结构化类型。** IPC 边界序列化稳定 `{ code, message, data? }`，内部用 thiserror 枚举，未知错误兜底 `INTERNAL_ERROR`；`LlmError` / `McpError` 按变体映射（不靠英文短语子串）；IPC 边界一条带 `code` / `provider` / `thread` 的 tracing 事件，日志可按这三者过滤。前端按 code 分支，不再对文本做正则。

            **版本耦合写进 README。** 看首屏的「记忆层 vX.Y.Z」而不是构建号——契约版本答「工具面变了没」，跨 major 才提示，不硬拦。

            **版本号 0.2.1**：0.2.0 起模型第一次能在本机执行动作；这一版把「装得起来、跑得起来、写得有确认、出错说得清」补齐，是同一条能力线上的收尾。

            **边界**：任意 shell 仍未做（M3 进行中），命令面是白名单；Homebrew cask 与 App Store 版未做。roadmap、product.md、AGENTS 等文档中英同批更新。

            Warden needs `repotory-mcp` on PATH for the memory layer; the chat itself works with any OpenAI-compatible provider. Run `repotory-agent init` from a terminal to check this machine before opening the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Tauri's bundler signs and notarises the .app, but it never notarises
      # the .dmg that wraps it — and the .dmg is what a browser downloads and
      # what Gatekeeper assesses first, so an un-notarised .dmg still gets the
      # "Apple cannot verify" dialog even though the app inside it carries a
      # valid ticket. The file is already on disk from the build, so it is
      # notarised in place and then re-uploaded over the asset tauri-action
      # published.
      - name: Notarise the disk image
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DMG=""
          for f in $(find src-tauri/target -name '*.dmg' -type f); do DMG="$f"; break; done
          if [ -z "${DMG}" ]; then
            echo "::error::the build produced no .dmg."
            exit 1
          fi
          notary_args=()
          # Same order as Tauri's own notarize_auth(): Apple ID first, then
          # the App Store Connect key. Whatever signed the .app signs the .dmg.
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            notary_args=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")
          elif [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY_PATH:-}" ]; then
            notary_args=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER")
          else
            echo "::error::no notarisation credentials for the .dmg."
            exit 1
          fi
          xcrun notarytool submit "$DMG" "${notary_args[@]}" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          # tauri-action published the .dmg under its own name; keep that name
          # so the notarised file replaces it instead of joining it.
          asset="$(gh release view "$TAG" --json assets --jq '[.assets[] | select(.name | endswith(".dmg")) | .name] | first // ""')"
          if [ -n "$asset" ] && [ "$asset" != "$(basename "$DMG")" ]; then
            mv "$DMG" "$(dirname "$DMG")/$asset"
          fi
          gh release upload "$TAG" "$DMG" --clobber
