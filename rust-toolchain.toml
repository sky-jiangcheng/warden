# The Rust toolchain this repository builds with.
#
# Why a file and not a version in the workflow: a pinned version in the YAML
# and the version on a developer's machine are two truths that drift.
# `actions-rust-lang/setup-rust-toolchain` reads this file when the workflow
# gives it no `toolchain` input, so CI and every local checkout resolve the
# same toolchain — one truth, one place.
#
# (`dtolnay/rust-toolchain` does NOT work for this: its `toolchain` input is
# `required: true` and the action exits 1 when the input is empty. Its `stable`
# branch has a default, but a default is still a second truth.)
#
# The version is the one this repository was developed and verified against
# (cargo check / clippy / test all green on it). Bump it deliberately, not
# incidentally: an MSRV bump can break the build for anyone on an older
# toolchain, and that shows up as a red CI run rather than as a clear message.
#
# `edition = "2024"` in Cargo.toml requires Rust 1.85 or newer.
[toolchain]
channel = "1.98.0"
