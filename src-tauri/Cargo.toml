[package]
name = "repotory-agent"
version = "0.1.14"
description = "A local copilot that reads the Cinder memory layer"
authors = ["sky-jiangcheng"]
edition = "2024"

# The crate has two binaries: the app itself and the fake MCP server the
# end-to-end test drives. `cargo run` refuses to guess between them, so the
# app is named as the default — without this, `tauri dev` fails with "could
# not determine which binary to run".
default-run = "repotory-agent"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "repotory_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is NOT in tauri's default feature set, and it is the single
# hard reason this project is on Tauri at all: Wails v2 has no tray
# (`options.App` has no Tray field, `pkg/menu`'s `TrayMenu` is a dead type),
# and the third-party systray crates need cgo, which breaks the bare-ubuntu
# `go build ./...` in the main repository's CI.
#
# `image-png` is needed because the tray icon is embedded with
# `tauri::image::Image::from_bytes`, which decodes through the `image`
# crate: PNG and ICO only, no SVG.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"

# The copilot announces a newly found repository through the operating
# system's notification centre. It is the one channel that reaches the user
# while the window is closed, which is the whole point of a resident copilot:
# the window is not always there, the tray is.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The model client speaks the OpenAI-compatible API (GET {base}/models and
# POST {base}/chat/completions), which every provider the user might pick
# exposes: OpenRouter, OpenAI, DeepSeek, SiliconFlow, vLLM, LM Studio and
# Ollama's `/v1` surface. One client, no vendor-specific code.
#
# The `rustls` feature is the TLS backend. The name matters: reqwest 0.13
# dropped the old `rustls-tls` spelling, and `rustls-no-provider` would need
# a crypto provider installed by hand. `rustls` pulls aws-lc-rs, which builds
# with the C compiler the runners already have.
# Provider API keys deliberately do NOT go through the OS credential store.
# They did (the `keyring` crate, macOS Keychain / Windows Credential Manager /
# Linux Secret Service), and on macOS that produced a login-keychain password
# prompt on every launch: a keychain ACL is bound to the app's code signature,
# and this app ships ad-hoc signed, so every build counts as a different
# application and "always allow" cannot stick. See `src/providers.rs` for the
# trade-off that replaced it (a 0600 file beside the config).
reqwest = { version = "0.13", features = ["json", "stream", "rustls"] }

# The MCP client drives a child process over stdio. `tokio::time::timeout`
# bounds every request (a wedged server must not leave a caller pending
# forever) and `tokio::sync::oneshot` carries each answer from the reader
# thread to the awaiting task. Tauri already depends on tokio with `rt` and
# `sync`, so this adds no new crate to the tree — only the `time` feature and
# `macros` for `#[tokio::test]`.
tokio = { version = "1", features = ["time", "macros"] }

# The model client consumes the HTTP response as a byte stream, so the answer
# arrives in pieces as it is written rather than all at once at the end.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-global-shortcut = "2"

[features]
# The test fixtures — the fake MCP server the end-to-end test drives.
#
# It is a feature rather than an unconditional build because it is a binary:
# an unconditional one would be compiled by every `cargo build`, including
# the release bundle's.
test-fixtures = []

[dev-dependencies]
# `tauri::test::mock_app` gives the tests a real `App` without a window
# server, which is what makes "the tray is installed" a checkable fact
# instead of a claim.
tauri = { version = "2", features = ["test"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# The fake MCP server the end-to-end test drives.
#
# It is a binary rather than a test because Cargo's `CARGO_BIN_EXE_<name>`
# — the only reliable way for an integration test to find a freshly built
# executable — is set for `[[bin]]` targets and NOT for `[[test]]` ones.
#
# `required-features` keeps it out of the ordinary build: without the
# feature, `cargo build` and the release bundle never compile it, so a test
# fixture has no business in a shipped app. The CI runs the tests with the
# feature on.
#
# The server prints nothing but protocol: the Rust test harness writes
# `running 1 test` to stdout before the first test runs, and the stdio
# transport is newline-delimited JSON-RPC — that line would land in the
# middle of the protocol stream. The client tolerates it (a line that is
# not JSON is noise, and there is a test for exactly that), but a fake
# server that prints only protocol is a better thing to test against: a
# defect in the client cannot hide behind the harness's noise.
[[bin]]
name = "fake-mcp-server"
path = "tests/support/fake_mcp_server.rs"
required-features = ["test-fixtures"]
test = false
bench = false

# The fake OpenAI-compatible server the end-to-end test drives. Same
# reasoning as the fake MCP server above: it is a binary so that
# `CARGO_BIN_EXE_<name>` is set, and it is gated behind the feature so it
# never reaches a shipped build.
[[bin]]
name = "fake-llm-server"
path = "tests/support/fake_llm_server.rs"
required-features = ["test-fixtures"]
test = false
bench = false
